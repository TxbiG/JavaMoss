name: Publish Java Package

on:
  release:
    types: [published] # Triggers automatically when you publish a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload artifacts to the Packages tab

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Change to '17' or your preferred Java version
          distribution: 'temurin'
          server-id: github # Matches the server ID in the Maven config step below
          settings-path: ${{ github.workspace }} # Generates settings.xml in workspace root

      # Builds the .jar file and deploys it straight to GitHub Packages tab
      # It automatically logs in using the built-in system GITHUB_TOKEN
      - name: Publish with Maven
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

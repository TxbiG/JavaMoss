name: Build JavaMoss

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout JavaMoss
        uses: actions/checkout@v4
        # We remove the hardcoded 'path' override so it maps naturally to the repository root

      - name: Checkout Moss (dependency)
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      - name: Set up Java Development Kit (for JNI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake (All Platforms)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOSS_FRAMEWORK_DIR="${{ github.workspace }}/Moss"

      - name: Build JavaMoss
        run: cmake --build build --config Release
